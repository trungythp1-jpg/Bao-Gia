<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GROVA HOLDINGS — Đặt lại mật khẩu</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f6;
      color: #17201d;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 34px;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,.10);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, #15945d, #1b6f56);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 23px;
    }

    .subtitle {
      text-align: center;
      color: #74807c;
      font-size: 14px;
      margin: 8px 0 28px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #d8e0dc;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #15945d;
      box-shadow: 0 0 0 3px rgba(21,148,93,.10);
    }

    button {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 10px;
      background: #15945d;
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #117b4e;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: #087443;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #15945d;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">G</div>

    <h1>Đặt lại mật khẩu</h1>

    <div class="subtitle">
      GROVA HOLDINGS<br>
      Tạo mật khẩu mới cho tài khoản quản trị
    </div>

    <form id="resetForm">

      <div class="field">
        <label for="password">
          Mật khẩu mới
        </label>

        <input
          id="password"
          type="password"
          autocomplete="new-password"
          placeholder="Nhập mật khẩu mới"
          minlength="8"
          required
        >
      </div>

      <div class="field">
        <label for="confirmPassword">
          Xác nhận mật khẩu
        </label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Nhập lại mật khẩu"
          minlength="8"
          required
        >
      </div>

      <button
        id="resetBtn"
        type="submit"
      >
        Đặt lại mật khẩu
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

    <a
      id="backLink"
      class="back"
      href="./"
    >
      ← Quay lại trang đăng nhập
    </a>

  </div>


<script>

const SUPABASE_URL =
  "https://covlqzbyabfcwjvxrmgj.supabase.co";


/*
  Dùng đúng PUBLISHABLE KEY
  mà bạn đã dùng ở admin/index.html.

  KHÔNG dùng Secret Key.
*/

const SUPABASE_KEY =
  "sb_publishable_bl1a_uzU2qzHDchJ7d3x_Q_XFrfeABG";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const form =
  document.getElementById(
    "resetForm"
  );

const password =
  document.getElementById(
    "password"
  );

const confirmPassword =
  document.getElementById(
    "confirmPassword"
  );

const resetBtn =
  document.getElementById(
    "resetBtn"
  );

const message =
  document.getElementById(
    "message"
  );


function showMessage(
  text,
  type
) {

  message.textContent = text;

  message.className =
    "message " + type;

}


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const newPassword =
      password.value;

    const confirm =
      confirmPassword.value;


    if (newPassword.length < 8) {

      showMessage(
        "Mật khẩu phải có ít nhất 8 ký tự.",
        "error"
      );

      return;

    }


    if (newPassword !== confirm) {

      showMessage(
        "Hai mật khẩu không giống nhau.",
        "error"
      );

      return;

    }


    resetBtn.disabled = true;

    resetBtn.textContent =
      "Đang cập nhật...";


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .updateUser({
            password: newPassword
          });


      if (error) {
        throw error;
      }


      showMessage(
        "Đặt lại mật khẩu thành công. Bạn có thể đăng nhập bằng mật khẩu mới.",
        "success"
      );


      form.reset();

      resetBtn.textContent =
        "Đã cập nhật";


      setTimeout(
        function() {

          window.location.href =
            "./";

        },
        1800
      );


    } catch (error) {

      console.error(
        "Reset password error:",
        error
      );


      showMessage(
        error.message ||
        "Không thể đặt lại mật khẩu. Vui lòng thử lại.",
        "error"
      );


      resetBtn.disabled = false;

      resetBtn.textContent =
        "Đặt lại mật khẩu";

    }

  }
);


/*
  Kiểm tra trạng thái Auth.
  Khi người dùng bấm link trong email,
  Supabase sẽ tạo recovery session.
*/

supabaseClient.auth.onAuthStateChange(
  function(event, session) {

    console.log(
      "GROVA Auth event:",
      event
    );

    if (
      event === "PASSWORD_RECOVERY" &&
      session
    ) {

      console.log(
        "Recovery session đã sẵn sàng."
      );

    }

  }
);

</script>

</body>
</html>
